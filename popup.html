<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 300px; font: 13px Arial, sans-serif; padding: 12px; margin: 0; }
    h3 { margin: 0 0 8px; color: #673ab7; }
    input { width: 100%; box-sizing: border-box; padding: 6px; margin: 6px 0; }
    button { background: #673ab7; color: #fff; border: 0; padding: 7px 12px; border-radius: 4px; cursor: pointer; }
    #status { margin-top: 8px; color: #188038; min-height: 16px; }
    ol { padding-left: 18px; color: #444; }
  </style>
</head>
<body>
  <h3>Forms AI Answer</h3>
  <label for="key">OpenRouter API key</label>
  <input id="key" type="password" placeholder="sk-or-v1-..." />
  <button id="save">Save</button>
  <div id="status"></div>
  <ol>
    <li>Open a Google Form.</li>
    <li>Click on a question box.</li>
    <li>Press <b>Ctrl</b> 3 times quickly (choice questions).</li>
    <li>Press <b>Shift</b> 3 times quickly (open text questions).</li>
  </ol>
  <script src="popup.js"></script>
</body>
</html>
